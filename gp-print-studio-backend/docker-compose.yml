services:
  # Servidor Apache + PHP
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: ${APP_CONTAINER_NAME}
    ports:
      - "${APP_PORT}:80"
    environment:
      # Variables para PostgreSQL (Base de datos principal)
      - DB_HOSTNAME=${PG_CONTAINER_NAME}
      - DB_USERNAME=${PG_USER}
      - DB_PASSWORD=${PG_PASSWORD}
      - DB_DATABASE=${PG_DATABASE}
      - DB_DRIVER=Postgre
      - DB_PORT=5432
      # Variables para SQL Server (Base de datos secundaria)
      - SQLSRV_HOSTNAME=${DB_CONTAINER_NAME}
      - SQLSRV_USERNAME=${DB_USER}
      - SQLSRV_PASSWORD=${DB_PASSWORD}
      - SQLSRV_DATABASE=${DB_DATABASE}
      - SQLSRV_PORT=${DB_PORT}
    volumes:
      - ./source:/var/www/html
      - ./.docker/vhost.conf:/etc/apache2/sites-available/000-default.conf
    networks:
      - app-srx-network
    depends_on:
      - db
      - postgres

  # Base de Datos SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: ${DB_CONTAINER_NAME}
    ports:
      - "${DB_PORT}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer # Versión gratuita para desarrollo
    volumes:
      - sql_data:/var/opt/mssql # Persistencia de datos
      - ./backups:/var/opt/mssql/backups # Mapeo de carpeta local para backups
    networks:
      - app-srx-network

  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ${PG_CONTAINER_NAME}
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-srx-network

networks:
  app-srx-network:
    driver: bridge
volumes:
  sql_data:
  pg_data:
