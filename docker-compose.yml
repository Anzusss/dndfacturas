# =============================================================================
# dndFacturas · Servicios de base de datos para desarrollo
#
#   docker compose up -d        Levanta PostgreSQL y Adminer (crea las tablas la 1.ª vez)
#   docker compose ps           Estado de los servicios
#   docker compose logs -f db   Registro de PostgreSQL
#   docker compose down         Detiene (los datos se conservan)
#   docker compose down -v      Detiene y BORRA los datos (la próxima vez se recrean las tablas)
#
# Credenciales y puertos: se leen del archivo `.env` (ver `.env.example`).
# Si no existe, se usan los valores por defecto indicados abajo (solo para desarrollo).
# =============================================================================

name: dndfacturas

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: plantillas (JSONB), plantilla activa por tipo y auditoría.
  # Los scripts de ./database/init se ejecutan en orden alfabético SOLO cuando
  # el volumen de datos está vacío (primera vez o tras `down -v`).
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dndfacturas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dndfacturas}
      POSTGRES_USER: ${POSTGRES_USER:-dndfacturas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dndfacturas_dev}
      TZ: America/Caracas
      PGTZ: America/Caracas
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Adminer: visor web de la base de datos en http://localhost:8080
  # Sistema: PostgreSQL · Servidor: db · Usuario/contraseña/BD: los de arriba.
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: dndfacturas-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    name: dndfacturas_db_data
